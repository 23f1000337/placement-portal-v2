{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4 mt-5">
            <h3 class="text-center mb-3"><i class="bi bi-box-arrow-in-right"></i> Login</h3>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Role</label>
                    <select name="role" class="form-select" required>
                        <option value="" disabled {% if request.args.get('role') not in ['admin','student','company'] %}selected{% endif %}>Select your role</option>
                        <option value="admin" {% if request.args.get('role') == 'admin' %}selected{% endif %}>Admin</option>
                        <option value="student" {% if request.args.get('role') == 'student' %}selected{% endif %}>Student</option>
                        <option value="company" {% if request.args.get('role') == 'company' %}selected{% endif %}>Company</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
            <hr>
            <p class="text-center mb-0">
                <a href="{{ url_for('auth.register_student') }}">Register as Student</a> |
                <a href="{{ url_for('auth.register_company') }}">Register as Company</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
