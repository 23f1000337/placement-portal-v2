{% extends "base.html" %}
{% block title %}My Profile{% endblock %}
{% block content %}
<div id="app">
    <h2><i class="bi bi-person-badge"></i> My Profile</h2>

    <div v-if="loading" class="text-center py-4">
        <div class="spinner-border text-primary"></div>
    </div>

    <form v-else @submit.prevent="saveProfile" class="card p-4" ref="profileForm">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Full Name</label>
                <input v-model="form.name" type="text" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Roll Number</label>
                <input type="text" class="form-control" :value="form.roll_no" disabled>
            </div>
        </div>
        <div class="row">
            <div class="col-md-3 mb-3">
                <label class="form-label">Branch</label>
                <input v-model="form.branch" type="text" class="form-control">
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label">Graduation Year</label>
                <input v-model="form.year" type="number" class="form-control" min="2024" max="2030">
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label">CGPA</label>
                <input v-model="form.cgpa" type="number" class="form-control" step="0.01" min="0" max="10">
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label">Phone</label>
                <input v-model="form.phone" type="text" class="form-control">
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Skills</label>
            <input v-model="form.skills" type="text" class="form-control" placeholder="Python, Java, SQL...">
        </div>
        <div class="mb-3">
            <label class="form-label">About</label>
            <textarea v-model="form.about" class="form-control" rows="2"></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Experience</label>
            <textarea v-model="form.experience" class="form-control" rows="3" placeholder="Internships, projects, work experience..."></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Resume (PDF/DOC)</label>
            <input type="file" ref="resumeFile" class="form-control" accept=".pdf,.doc,.docx">
            <small v-if="form.resume" class="text-muted">
                Current: <a :href="'/uploads/' + form.resume" target="_blank">[[ form.resume ]]</a>
            </small>
        </div>
        <button type="submit" class="btn btn-success" :disabled="saving">
            [[ saving ? 'Saving...' : 'Save Profile' ]]
        </button>
        <span v-if="message" class="text-success ms-3">[[ message ]]</span>
    </form>
</div>
{% endblock %}

{%- block scripts %}
<script src="/frontend/components/StudentProfile.js"></script>
{%- endblock %}
