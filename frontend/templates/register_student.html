{% extends "base.html" %}
{% block title %}Student Registration{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card p-4">
            <h3 class="mb-3"><i class="bi bi-person-plus"></i> Student Registration</h3>
            <form method="POST" enctype="multipart/form-data">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Full Name *</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email *</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Password *</label>
                        <input type="password" name="password" class="form-control" required minlength="4">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Roll Number *</label>
                        <input type="text" name="roll_no" class="form-control" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Branch</label>
                        <input type="text" name="branch" class="form-control" placeholder="CS, IT...">
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Graduation Year</label>
                        <input type="number" name="year" class="form-control" min="2024" max="2030" placeholder="2026">
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label">CGPA</label>
                        <input type="number" name="cgpa" step="0.01" min="0" max="10" class="form-control">
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Phone</label>
                        <input type="tel" name="phone" class="form-control">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Skills</label>
                    <input type="text" name="skills" class="form-control" placeholder="Python, Java, SQL...">
                </div>
                <div class="mb-3">
                    <label class="form-label">About</label>
                    <textarea name="about" class="form-control" rows="2"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Resume (PDF/DOC)</label>
                    <input type="file" name="resume" class="form-control" accept=".pdf,.doc,.docx">
                </div>
                <button type="submit" class="btn btn-primary w-100">Register</button>
            </form>
            <p class="mt-3 text-center">Already registered? <a href="{{ url_for('auth.login') }}">Login</a></p>
        </div>
    </div>
</div>
{% endblock %}
