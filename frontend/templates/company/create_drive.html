{% extends "base.html" %}
{% block title %}Create Drive{% endblock %}
{% block content %}
<div id="app">
    <h2><i class="bi bi-plus-circle"></i> Create Placement Drive</h2>

    <form @submit.prevent="createDrive" class="card p-4">
        <div class="mb-3">
            <label class="form-label">Job Title *</label>
            <input v-model="form.title" type="text" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea v-model="form.description" class="form-control" rows="3"></textarea>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Location</label>
                <input v-model="form.location" type="text" class="form-control">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Salary</label>
                <input v-model="form.salary" type="text" class="form-control" placeholder="e.g. 6-8 LPA">
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Skills Required</label>
            <input v-model="form.skills_required" type="text" class="form-control" placeholder="Python, Java, SQL...">
        </div>
        <div class="mb-3">
            <label class="form-label">Eligibility Criteria (general)</label>
            <textarea v-model="form.eligibility" class="form-control" rows="2" placeholder="e.g. CGPA 7.0+, CS/IT only"></textarea>
        </div>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">Eligible Branches</label>
                <input v-model="form.eligible_branches" type="text" class="form-control" placeholder="CS,IT,ECE (comma separated)">
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Minimum CGPA</label>
                <input v-model="form.min_cgpa" type="number" step="0.1" min="0" max="10" class="form-control">
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Eligible Year</label>
                <input v-model="form.eligible_year" type="number" min="2024" max="2030" class="form-control" placeholder="2026">
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Application Deadline *</label>
            <input v-model="form.deadline" type="date" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary" :disabled="saving">
            [[ saving ? 'Creating...' : 'Create Drive' ]]
        </button>
        <a href="{{ url_for('company.company_dashboard') }}" class="btn btn-secondary ms-2">Cancel</a>
    </form>
</div>
{% endblock %}

{%- block scripts %}
<script src="/frontend/components/CompanyCreateDrive.js"></script>
{%- endblock %}
