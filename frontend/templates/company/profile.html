{% extends "base.html" %}
{% block title %}Company Profile{% endblock %}
{% block content %}
<div id="app">
    <h2><i class="bi bi-person-badge"></i> Company Profile</h2>

    <div v-if="loading" class="text-center py-4">
        <div class="spinner-border text-primary"></div>
    </div>

    <form v-else @submit.prevent="saveProfile" class="card p-4">
        <div class="mb-3">
            <label class="form-label">Company Name</label>
            <input v-model="form.name" type="text" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Industry</label>
            <input v-model="form.industry" type="text" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">Website</label>
            <input v-model="form.website" type="url" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea v-model="form.description" class="form-control" rows="3"></textarea>
        </div>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">HR Name</label>
                <input v-model="form.hr_name" type="text" class="form-control">
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">HR Email</label>
                <input v-model="form.hr_email" type="email" class="form-control">
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">HR Phone</label>
                <input v-model="form.hr_phone" type="text" class="form-control">
            </div>
        </div>
        <button type="submit" class="btn btn-success" :disabled="saving">
            [[ saving ? 'Saving...' : 'Save Changes' ]]
        </button>
        <span v-if="message" class="text-success ms-3">[[ message ]]</span>
    </form>
</div>
{% endblock %}

{%- block scripts %}
<script src="/frontend/components/CompanyProfile.js"></script>
{%- endblock %}
